# 工程师结构化简历模板（RenderCV 风格）
# 把简历当作数据管理：内容在 cv 段，排版在 design 段，语言在 locale 段。
# 修改内容无需动格式；切换主题只需改 design.theme。
# 字段说明见 https://docs.rendercv.com （或据此自行渲染为 Markdown / PDF）

cv:
  name: 张三
  location: 北京
  email: zhangsan@example.com
  phone: "138********"
  website: https://blog.example.com
  social_networks:
    - network: GitHub
      username: zhangsan
    - network: LinkedIn
      username: zhangsan
  sections:
    summary:
      - 6 年 Java 后端开发经验，擅长高并发分布式系统设计与性能优化，主导过日活千万级系统重构。
    experience:
      - company: ABC 公司
        position: 高级后端工程师
        start_date: 2022-03
        end_date: present
        highlights:
          - "主导订单服务重构，QPS 从 1k 提升至 5k，P99 延迟下降 60%"
          - "引入 Redis 多级缓存，命中率从 72% 提升至 96%，数据库负载下降 45%"
      - company: DEF 公司
        position: 后端工程师
        start_date: 2019-07
        end_date: 2022-02
        highlights:
          - "搭建基于 Kafka 的异步消息 pipeline，吞吐提升 3 倍"
    education:
      - institution: XX 大学
        degree: 本科
        area: 计算机科学与技术
        start_date: 2014-09
        end_date: 2018-06
    projects:
      - name: 开源项目 XXX
        highlights:
          - "Star 1.2k 的轻量级 RPC 框架，支持插件化协议"
    skills:
      - "Java / Spring Boot / Spring Cloud / MyBatis"
      - "MySQL / Redis / Kafka / Docker / Kubernetes / Linux"

design:
  theme: classic
  page:
    size: a4
    top_margin: 0.7in
    bottom_margin: 0.7in
    left_margin: 0.7in
    right_margin: 0.7in
  colors:
    body: rgb(0, 0, 0)
    section_titles: rgb(0, 79, 144)
    links: rgb(0, 79, 144)
  typography:
    line_spacing: 0.6em
    alignment: justified
    font_family: "Source Sans 3"

locale:
  language: chinese
  present: 至今
  month: 月
  year: 年
